<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Nin.Map</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body style="display:flex; flex-direction:column; min-height:100vh;">
  <header class="topbar">
    <div class="topbar__brand">
      <span class="topbar__logo">🗺️</span>
      <span class="topbar__title">Nin<span class="accent">.Map</span></span>
    </div>
    <nav class="topbar__nav">
      <a href="../index.html" class="topbar__link">Mapa</a>
      <a href="../missions.html" class="topbar__link">Missões</a>
      <a href="index.html" class="topbar__link topbar__link--active">Admin</a>
    </nav>
  </header>

  <div class="auth-wrap">
    <div class="auth-card">
      <h1>Entrar</h1>
      <form id="login-form">
        <div class="form-field">
          <label for="email">E-mail</label>
          <input type="email" id="email" required autocomplete="username" />
        </div>
        <div class="form-field">
          <label for="password">Senha</label>
          <input type="password" id="password" required autocomplete="current-password" />
        </div>
        <p id="login-error" class="error-text"></p>
        <button type="submit" class="btn-primary" style="width:100%;">Entrar</button>
      </form>
      <p class="help-text" style="margin-top:14px;">
        O acesso é criado em Supabase → Authentication → Users. Não há
        cadastro público de admin por aqui.
      </p>
    </div>
  </div>

  <script type="module" src="js/login.js"></script>
</body>
</html>
