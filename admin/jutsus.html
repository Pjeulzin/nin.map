<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin · Jutsus — Nin.Map</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="admin-body" style="display:flex; flex-direction:column;">
  <header class="topbar">
    <div class="topbar__brand">
      <span class="topbar__logo">🗺️</span>
      <span class="topbar__title">Nin<span class="accent">.Map</span></span>
    </div>
    <nav class="topbar__nav">
      <a href="pins.html" class="topbar__link">Pins</a>
      <a href="missions.html" class="topbar__link">Missões</a>
      <a href="mobs.html" class="topbar__link">Mobs</a>
      <a href="npcs.html" class="topbar__link">NPCs</a>
      <a href="items.html" class="topbar__link">Itens</a>
      <a href="masteries.html" class="topbar__link">Maestrias</a>
      <a href="jutsus.html" class="topbar__link topbar__link--active">Jutsus</a>
      <a href="../builds.html" class="topbar__link">Builds</a>
      <a href="../jutsus.html" class="topbar__link">Ver jutsus</a>
    </nav>
    <div class="topbar__actions">
      <button id="btn-logout" class="btn">Sair</button>
    </div>
  </header>

  <main class="admin-page">
    <div class="admin-form-card" style="max-width:640px;">
      <h2 id="form-title">Novo jutsu</h2>
      <form id="jutsu-form">
        <input type="hidden" id="jutsu-id" />

        <div class="form-field">
          <label for="jutsu-name">Nome</label>
          <input type="text" id="jutsu-name" required />
        </div>

        <div class="form-row">
          <div class="form-field">
            <label for="jutsu-mastery">Maestria</label>
            <select id="jutsu-mastery">
              <option value="">— Não definida —</option>
            </select>
          </div>
          <div class="form-field">
            <label for="jutsu-branch">Ramificação (opcional)</label>
            <select id="jutsu-branch">
              <option value="">— Nenhuma —</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-field">
            <label for="jutsu-rank">Rank</label>
            <select id="jutsu-rank">
              <option value="">— Não definido —</option>
              <option value="S">S</option>
              <option value="A">A</option>
              <option value="B">B</option>
              <option value="C">C</option>
              <option value="D">D</option>
            </select>
          </div>
          <div class="form-field">
            <label for="jutsu-level">Nível necessário</label>
            <input type="number" id="jutsu-level" min="1" />
          </div>
          <div class="form-field">
            <label for="jutsu-chakra">Custo de chakra</label>
            <input type="number" id="jutsu-chakra" min="0" />
          </div>
          <div class="form-field">
            <label for="jutsu-cooldown">Cooldown (segundos)</label>
            <input type="number" id="jutsu-cooldown" min="0" />
          </div>
        </div>

        <p class="help-text" style="margin-top:0;">
          Requisito de atributo e dano usados pelo calculador de build
          (<a href="../builds.html">builds.html</a>) — mesma lógica do
          ninforge.xyz: dano = dano base + (escala × atributo total).
        </p>
        <div class="form-row">
          <div class="form-field">
            <label for="jutsu-stat-req-stat">Atributo exigido</label>
            <select id="jutsu-stat-req-stat">
              <option value="">— Nenhum —</option>
              <option value="str">STR (Força)</option>
              <option value="for">FORT (Fortitude)</option>
              <option value="int">INT (Intelecto)</option>
              <option value="agi">AGI (Agilidade)</option>
              <option value="cha">CHK (Chakra)</option>
            </select>
          </div>
          <div class="form-field">
            <label for="jutsu-stat-req-value">Valor exigido</label>
            <input type="number" id="jutsu-stat-req-value" min="0" />
          </div>
          <div class="form-field">
            <label for="jutsu-base-damage">Dano base</label>
            <input type="number" id="jutsu-base-damage" min="0" />
          </div>
          <div class="form-field">
            <label for="jutsu-scaling">Escala (ex: 0.5)</label>
            <input type="number" id="jutsu-scaling" min="0" step="0.01" />
          </div>
        </div>

        <div class="form-field">
          <label for="jutsu-description">Descrição / efeito</label>
          <textarea id="jutsu-description" placeholder="Dano, alcance, área de efeito, condições, etc."></textarea>
        </div>

        <div class="form-field">
          <label>Ícone</label>
          <div style="display:flex; align-items:center; gap:12px;">
            <div class="item-icon-frame item-icon-frame--lg" id="jutsu-image-preview">
              <span class="item-icon-frame__empty">Sem imagem</span>
            </div>
            <div style="display:flex; flex-direction:column; gap:6px;">
              <input type="file" id="jutsu-image" accept="image/png, image/jpeg, image/webp, image/gif" />
              <button type="button" id="btn-remove-image" class="btn btn-small" style="display:none; align-self:flex-start;">Remover imagem</button>
            </div>
          </div>
        </div>

        <p id="jutsu-error" class="error-text"></p>

        <div style="display:flex; gap:8px;">
          <button type="submit" class="btn-primary">Salvar</button>
          <button type="button" id="btn-cancel-edit" class="btn" style="display:none;">Cancelar edição</button>
        </div>
      </form>
    </div>

    <div class="admin-table-wrap">
      <div id="jutsus-status" class="status-message"></div>
      <label for="jutsus-mastery-filter" class="visually-hidden">Filtrar por maestria</label>
      <select id="jutsus-mastery-filter" class="select" style="margin-bottom:10px;">
        <option value="">Todas as maestrias</option>
      </select>
      <table class="admin-table">
        <thead>
          <tr>
            <th></th>
            <th>Nome</th>
            <th>Maestria</th>
            <th>Rank</th>
            <th>Nível</th>
            <th>Chakra</th>
            <th>Cooldown</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="jutsus-tbody"></tbody>
      </table>
    </div>
  </main>

  <script type="module" src="js/jutsus-admin.js"></script>
</body>
</html>
