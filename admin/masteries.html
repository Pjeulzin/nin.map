<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin · Maestrias — Nin.Map</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="admin-body" style="display:flex; flex-direction:column;">
  <header class="topbar">
    <div class="topbar__brand">
      <span class="topbar__logo">🗺️</span>
      <span class="topbar__title">Nin<span class="accent">.Map</span></span>
    </div>
    <nav class="topbar__nav">
      <a href="pins.html" class="topbar__link">Pins</a>
      <a href="missions.html" class="topbar__link">Missões</a>
      <a href="mobs.html" class="topbar__link">Mobs</a>
      <a href="npcs.html" class="topbar__link">NPCs</a>
      <a href="items.html" class="topbar__link">Itens</a>
      <a href="masteries.html" class="topbar__link topbar__link--active">Maestrias</a>
      <a href="jutsus.html" class="topbar__link">Jutsus</a>
      <a href="../builds.html" class="topbar__link">Builds</a>
      <a href="../masteries.html" class="topbar__link">Ver maestrias</a>
    </nav>
    <div class="topbar__actions">
      <button id="btn-logout" class="btn">Sair</button>
    </div>
  </header>

  <main class="admin-page">
    <div class="admin-form-card">
      <h2 id="form-title">Nova maestria</h2>
      <form id="mastery-form">
        <input type="hidden" id="mastery-id" />

        <div class="form-row">
          <div class="form-field">
            <label for="mastery-slug">Slug (id estável)</label>
            <input type="text" id="mastery-slug" placeholder="ex: fogo" required />
          </div>
          <div class="form-field" style="flex:2;">
            <label for="mastery-name">Nome</label>
            <input type="text" id="mastery-name" required />
          </div>
        </div>

        <div class="form-field">
          <label for="mastery-description">Descrição</label>
          <textarea id="mastery-description"></textarea>
        </div>

        <div class="form-field">
          <label for="mastery-playstyle">Como jogar (pontos fortes/fracos, PvE x PvP)</label>
          <textarea id="mastery-playstyle" placeholder="Ex: forte em área e dano, mas projéteis lentos contra alvos correndo..."></textarea>
        </div>

        <div class="form-field">
          <label>Ícone</label>
          <div style="display:flex; align-items:center; gap:12px;">
            <div class="item-icon-frame item-icon-frame--lg" id="mastery-image-preview">
              <span class="item-icon-frame__empty">Sem imagem</span>
            </div>
            <div style="display:flex; flex-direction:column; gap:6px;">
              <input type="file" id="mastery-image" accept="image/png, image/jpeg, image/webp, image/gif" />
              <button type="button" id="btn-remove-image" class="btn btn-small" style="display:none; align-self:flex-start;">Remover imagem</button>
            </div>
          </div>
        </div>

        <div class="form-field">
          <label>Ramificações (opcional)</label>
          <p class="help-text">
            Algumas maestrias se dividem em dois focos — ex: Medicina
            tem "Foco em Chakra" e "Foco em Dano (Intelecto)". Deixe
            vazio se essa maestria não tiver ramificação.
          </p>
          <div id="branches-list"></div>
          <button type="button" id="btn-add-branch" class="btn btn-small" style="align-self:flex-start;">+ Adicionar ramificação</button>
        </div>

        <p id="mastery-error" class="error-text"></p>

        <div style="display:flex; gap:8px; margin-top:8px;">
          <button type="submit" class="btn-primary">Salvar</button>
          <button type="button" id="btn-cancel-edit" class="btn" style="display:none;">Cancelar edição</button>
        </div>
      </form>
    </div>

    <div class="admin-table-wrap">
      <div id="masteries-status" class="status-message"></div>
      <table class="admin-table">
        <thead>
          <tr>
            <th></th>
            <th>Nome</th>
            <th>Slug</th>
            <th>Ramificações</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="masteries-tbody"></tbody>
      </table>
    </div>
  </main>

  <script type="module" src="js/masteries-admin.js"></script>
</body>
</html>
