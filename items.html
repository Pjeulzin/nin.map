<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Itens — Nin.Map</title>
  <meta name="description" content="Catálogo de itens de Nin Online: anéis, armas, roupas, consumíveis e itens de mob." />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="ninmap-panel" class="float-panel" data-minimized="false">
    <div id="panel-header" class="float-panel__header">
      <span class="float-panel__drag-icon" aria-hidden="true">⠿</span>
      <span class="float-panel__brand">
        <span class="topbar__logo">🗺️</span>
        <span class="float-panel__title">Nin<span class="accent">.Map</span></span>
      </span>
      <button id="panel-toggle" type="button" class="float-panel__toggle" aria-expanded="true" title="Minimizar">–</button>
    </div>
    <div id="panel-body" class="float-panel__body">
      <nav class="float-panel__nav">
        <a href="index.html" class="float-panel__link">
          <span class="float-panel__icon" aria-hidden="true">🗺️</span>
          <span data-i18n="nav_map">Mapa</span>
        </a>
        <a href="missions.html" class="float-panel__link">
          <span class="float-panel__icon" aria-hidden="true">📜</span>
          <span data-i18n="nav_missions">Missões</span>
        </a>
        <a href="mobs.html" class="float-panel__link">
          <span class="float-panel__icon" aria-hidden="true">👹</span>
          <span data-i18n="nav_mobs">Mobs</span>
        </a>
        <a href="npcs.html" class="float-panel__link">
          <span class="float-panel__icon" aria-hidden="true">🧙</span>
          <span data-i18n="nav_npcs">NPCs</span>
        </a>
        <a href="items.html" class="float-panel__link float-panel__link--active">
          <span class="float-panel__icon" aria-hidden="true">🎒</span>
          <span data-i18n="nav_items">Itens</span>
        </a>
        <a href="masteries.html" class="float-panel__link">
          <span class="float-panel__icon" aria-hidden="true">🌀</span>
          <span data-i18n="nav_masteries">Maestrias</span>
        </a>
        <a href="jutsus.html" class="float-panel__link">
          <span class="float-panel__icon" aria-hidden="true">🥷</span>
          <span data-i18n="nav_jutsus">Jutsus</span>
        </a>
        <a href="builds.html" class="float-panel__link">
          <span class="float-panel__icon" aria-hidden="true">🛠️</span>
          <span data-i18n="nav_builds">Builds</span>
        </a>
      </nav>

      <div class="float-panel__divider"></div>

      <div id="global-controls" class="float-panel__controls"></div>

      <div class="float-panel__divider"></div>

      <div class="float-panel__filters">
        <label for="search-items" class="visually-hidden">Pesquisar itens</label>
        <input
          type="search"
          id="search-items"
          class="select"
          data-i18n-placeholder="search_items_placeholder"
          placeholder="Pesquisar por nome..."
        />
        <label for="filter-type" class="visually-hidden">Filtrar por tipo</label>
        <select id="filter-type" class="select" title="Filtrar por tipo">
          <option value="" data-i18n="filter_all_types">Todos os tipos</option>
          <option value="anel" data-i18n="item_type_anel">Anel</option>
          <option value="arma" data-i18n="item_type_arma">Arma</option>
          <option value="roupa" data-i18n="item_type_roupa">Roupa</option>
          <option value="consumivel" data-i18n="item_type_consumivel">Consumível</option>
          <option value="item_mob" data-i18n="item_type_item_mob">Item de mob</option>
        </select>
      </div>

      <div class="float-panel__divider"></div>

      <a href="admin/index.html" class="float-panel__admin-link">
        <span aria-hidden="true">⚙️</span>
        <span data-i18n="nav_admin">Admin</span>
      </a>
      <p class="float-panel__credit"><span data-i18n="footer_credit">Criado por</span> <strong>Pjeul</strong></p>
    </div>
  </div>

  <main class="page">
    <div id="items-status" class="status-message"></div>
    <div class="admin-table-wrap" style="margin:0;">
      <table class="admin-table">
        <thead>
          <tr>
            <th></th>
            <th data-i18n="th_name">Nome</th>
            <th data-i18n="th_type">Tipo</th>
            <th data-i18n="th_description">Descrição</th>
            <th data-i18n="th_dropped_by">Dropado por</th>
            <th data-i18n="th_damage">Dano</th>
            <th data-i18n="th_range">Alcance</th>
          </tr>
        </thead>
        <tbody id="items-tbody"></tbody>
      </table>
    </div>
  </main>

  <script type="module" src="js/nav.js"></script>
  <script type="module" src="js/items.js"></script>
</body>
</html>
